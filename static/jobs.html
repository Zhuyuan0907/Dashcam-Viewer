<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>背景作業 — 行車記錄</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/ui.css?v=2.2.0">
  <link rel="stylesheet" href="/static/jobs.css?v=2.2.0">
  <script src="/static/themes.js"></script>
  <link rel="stylesheet" href="/static/themes.css?v=2.1.2">
</head>
<body class="fit-page fit-mobile">
<header class="hdr">
  <div class="wrap hdr-inner">
    <a class="hdr-brand" href="/">
      <div class="hdr-brand-mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></div>
      <span class="hdr-brand-text">行車記錄</span>
    </a>
    <nav class="hdr-nav">
      <a class="hdr-link" data-href="/" href="/">首頁</a>
      <a class="hdr-link" data-href="/browse" href="/browse">瀏覽旅程</a>
      <a class="hdr-link" data-href="/clips" href="/clips">片段</a>
      <a class="hdr-link" data-href="/upload" href="/upload">上傳</a>
      <a class="hdr-link admin-only" data-href="/admin" href="/admin" style="display:none">管理</a>
      <a class="hdr-link admin-only" data-href="/ops" href="/ops" style="display:none">維運</a>
    </nav>
    <div class="hdr-ctrls" id="hdr-ctrls"></div>
  </div>
</header>
<main class="page-body">
  <div class="wrap fit-wrap jobs-page">
    <div class="page-head">
      <div class="page-head-title">
        <h1>背景作業</h1>
        <span class="page-head-sub">影片整理、裁剪與匯出的進度與處理紀錄</span>
      </div>
      <div class="page-head-actions">
        <span id="connection" role="status" aria-live="polite"></span>
        <button class="btn btn--ghost btn--sm" id="refresh" type="button">重新整理</button>
      </div>
    </div>
    <div class="jobs-layout" id="jobs-layout">
      <section class="jobs-side" aria-label="作業清單">
        <div class="jobs-filters" role="group" aria-label="篩選作業">
          <button class="jobs-filter is-active" data-filter="" type="button" aria-pressed="true">全部 <b id="count-all">0</b></button>
          <button class="jobs-filter" data-filter="active" type="button" aria-pressed="false">處理中 <b id="count-active">0</b></button>
          <button class="jobs-filter" data-filter="succeeded" type="button" aria-pressed="false">完成 <b id="count-complete">0</b></button>
          <button class="jobs-filter" data-filter="attention" type="button" aria-pressed="false">需留意 <b id="count-attention">0</b></button>
        </div>
        <div id="job-list" class="jobs-list" role="listbox" aria-label="作業"></div>
        <button class="btn btn--ghost btn--sm jobs-more" id="more" type="button" hidden>載入更多</button>
      </section>
      <section class="jobs-detail" id="job-detail" aria-live="polite">
        <div class="job-empty">選擇左側的作業以查看處理紀錄。</div>
      </section>
    </div>
  </div>
</main>
<div id="toast-container"></div>
<script src="/static/app.js?v=2.2.0"></script>
<script src="/static/job-log.js?v=2.2.0"></script>
<script src="/static/jobs.js?v=2.2.0"></script>
</body>
</html>
