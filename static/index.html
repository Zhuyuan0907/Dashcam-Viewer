<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title data-i18n-title="title.index">行車記錄</title>
  <link rel="stylesheet" href="/static/style.css?v=2.7.0">
  <link rel="stylesheet" href="/static/ui.css?v=2.2.0">
  <style>
    /* ── 首頁:一屏式概覽(重點明確、資訊密度適中;不再使用隨機標語) ───────── */
    /* 版面:桌機(寬 ≥981、高 ≥600)整頁剛好一屏——上方標題列固定高度,下方兩欄吃滿剩餘高度;
       大縮圖不鎖 16:9,而是填滿可用高度。空間不足時用 container query 依序收起次要區塊,
       絕不讓內容被切掉。較窄或較矮的視窗改回一般捲動。 */
    .home { display: flex; flex-direction: column; gap: clamp(12px, 2.2vh, 26px); }
    .home-hero { flex: none; display: flex; align-items: flex-end; justify-content: space-between; gap: 14px 28px; }
    .home-hero > div:first-child { min-width: 0; }
    .home-greet { font-size: 13.5px; margin-bottom: clamp(4px, .8vh, 8px); }
    .home-title { font-family: var(--font-display); font-weight: 800; font-size: clamp(28px, min(4vw, 5.6vh), 54px);
      line-height: 1.08; letter-spacing: -.035em; margin: 0; white-space: nowrap; }
    .home-title em { font-style: normal; color: var(--accent); }
    .home-sub { margin-top: clamp(6px, 1vh, 10px); font-size: 14.5px; color: var(--ink-2); display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center; }
    .home-sub a { color: var(--accent); font-weight: 700; }
    .home-sub a::after { content: " →"; }
    .home-stats { flex: none; display: grid; grid-template-columns: repeat(4, auto); gap: 6px; }
    .home-stat { padding: clamp(8px, 1.2vh, 11px) clamp(12px, 1.2vw, 16px); border-radius: var(--radius-sm); background: var(--surface);
      box-shadow: var(--shadow-sm); min-width: 0; }
    .home-stat b { display: block; font-size: clamp(18px, min(1.7vw, 2.6vh), 24px); line-height: 1.15; font-variant-numeric: tabular-nums; color: var(--ink); letter-spacing: -.02em; white-space: nowrap; }
    .home-stat span { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }

    .home-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(330px, 1fr); gap: clamp(16px, 2vw, 28px); }
    .home-col { display: flex; flex-direction: column; gap: clamp(12px, 1.8vh, 20px); min-width: 0; min-height: 0; }
    .home-main .feature { aspect-ratio: 16 / 9; }
    .recent-wrap { flex: none; }
    .latest-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; align-content: stretch; }
    .latest-facts:empty { display: none; }
    .latest-facts div { display: flex; flex-direction: column; justify-content: center; min-width: 0; padding: 12px 14px; min-height: 64px;
      border-radius: var(--radius-sm); background: var(--surface); box-shadow: var(--shadow-sm); }
    .latest-facts b { font-size: clamp(16px, 1.4vw, 20px); font-variant-numeric: tabular-nums; letter-spacing: -.02em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .latest-facts span { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
    .recent-wrap[hidden] { display: none !important; }

    @media (min-width: 981px) and (min-height: 600px) {
      .home-grid { flex: 1; min-height: 0; grid-template-rows: minmax(0, 1fr); }
      .home-main, .home-side { container-type: size; }
      .home-main #feature { flex: 1; min-height: 0; display: flex; }
      .recent-wrap { flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
      .recent { flex: 1; min-height: 0; overflow: hidden; }
      .home-main #feature > * { flex: 1; }
      .home-main #feature { max-height: 90cqw; }
      .home-main .feature { aspect-ratio: auto; height: 100%; min-height: 0; }
      .home-main .latest-facts { flex: none; }
      .home-main:has(.latest-facts:not(:empty)) { justify-content: flex-start; }
      /* 主欄偏寬(放不下 4:3 縮圖 + 資訊列):收起資訊列,縮圖填滿 */
      @container (min-aspect-ratio: 23 / 20) {
        .home-main .latest-facts { display: none; }
        .home-main #feature { max-height: none; }
      }
      .home-side { overflow: hidden; }
      /* 側欄太矮:依序收起本月 → 快捷動作說明 → 日曆圖例列 */
      @container (max-height: 730px) { .home-side .month { display: none; } }
      /* 側欄偏矮:快捷動作縮成一排 4 個圖示磚,把空間讓給最近旅程 */
      @container (max-height: 660px) {
        .home-side .quick { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .home-side .quick a, .home-side .quick button { flex-direction: column; justify-content: center; text-align: center; gap: 6px; padding: 10px 4px; }
        .home-side .quick b { font-size: 12.5px; white-space: nowrap; }
        .home-side .quick small { display: none; }
      }
      @container (max-height: 340px) { .home-side .cal-foot { display: none; } }
    }
    /* 窄或矮的視窗:回到一般捲動,不鎖住頁面 */
    @media (max-width: 980px), (max-height: 599px) {
      body.fit-page.home-page { height: auto; overflow: visible; }
      body.fit-page.home-page .page-body { height: auto; overflow: visible; display: block; }
      body.fit-page.home-page .fit-wrap { padding-block: 16px 36px; }
    }
    @media (max-width: 1180px) and (min-width: 981px) {
      .home-stat span { font-size: 10.5px; }
      .home-grid { grid-template-columns: minmax(0, 1.35fr) minmax(310px, 1fr); }
    }
    .card-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .card-title h2 { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
    .card-title a, .card-title span { font-size: 12.5px; color: var(--ink-3); }
    .card-title a:hover { color: var(--accent); }

    /* 最新一趟:大縮圖 + 疊字資訊 */
    .feature { position: relative; display: block; border-radius: var(--radius-lg); overflow: hidden; color: #fff;
      background: linear-gradient(160deg, oklch(.42 .04 200), oklch(.26 .03 220)); box-shadow: var(--shadow-md);
      width: 100%; transition: transform .25s ease, box-shadow .25s ease; }
    .feature:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); color: #fff; }
    .feature img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .6s ease; }
    .feature:hover img { transform: scale(1.02); }
    .feature::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 45%, rgba(5, 15, 18, .78)); }
    .feature-info { position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; padding: clamp(14px, 2vw, 22px);
      display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; }
    .feature-tag { display: inline-block; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; padding: 3px 9px; border-radius: 99px;
      background: rgba(255,255,255,.18); backdrop-filter: blur(6px); margin-bottom: 8px; }
    .feature h3 { font-size: clamp(18px, 2vw, 24px); letter-spacing: -.02em; }
    .feature p { font-size: 13px; opacity: .85; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .feature .play { flex: none; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center;
      background: rgba(255,255,255,.94); color: var(--accent); box-shadow: var(--shadow-md); transition: transform .2s ease; }
    .feature:hover .play { transform: scale(1.08); }

    /* 最近旅程:側欄精簡清單,依可用高度顯示能完整放下的筆數 */
    .recent-wrap .card-title { margin-bottom: 6px; }
    .recent { display: flex; flex-direction: column; }
    .recent a { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; align-items: center; gap: 12px;
      padding: 7px 6px; margin: 0 -6px; border-radius: var(--radius-sm); color: var(--ink); transition: background-color .15s ease; }
    .recent a + a { border-top: 1px solid var(--line); }
    .recent a:hover { background: var(--surface-2); }
    .recent a[hidden] { display: none; }
    .recent .thumb { width: 76px; aspect-ratio: 16 / 9; border-radius: 8px; background: var(--surface-3); overflow: hidden; }
    .recent .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .recent b { display: block; font-size: 13.5px; font-variant-numeric: tabular-nums; }
    .recent small { font-size: 11.5px; color: var(--ink-3); }
    .recent .go { color: var(--ink-3); font-size: 16px; }
    .panel-box { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 16px 18px; }

    /* GitHub 風騎乘日曆(精簡版) */
    .cal-scroll { max-width: 100%; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
    .cal-box { container-type: inline-size; }
    .cal { display: inline-block; min-width: 100%; --gap: 3px; --cell: clamp(10px, calc((100cqw - 22px) / 26 - 3px), 17px); }
    .cal-months { display: grid; grid-auto-flow: column; grid-auto-columns: calc(var(--cell) + var(--gap));
      margin-left: calc(18px + var(--gap)); margin-bottom: 5px; font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); }
    .cal-months span { white-space: nowrap; overflow: visible; }
    .cal-body { display: flex; gap: var(--gap); }
    .cal-weekdays { display: grid; grid-template-rows: repeat(7, var(--cell)); gap: var(--gap); width: 18px; font-size: 9.5px; color: var(--ink-3); }
    .cal-weekdays span { display: flex; align-items: center; line-height: 1; }
    .cal-grid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, var(--cell)); grid-auto-columns: var(--cell); gap: var(--gap); }
    .cal-grid .heat-cell { width: var(--cell); height: var(--cell); aspect-ratio: auto; border-radius: 3px;
      outline: 1px solid color-mix(in oklch, var(--ink) 6%, transparent); outline-offset: -1px; }
    .cal-grid a.heat-cell:hover { transform: scale(1.3); outline-color: var(--accent); }
    .cal-grid .heat-cell.is-future { background: transparent; outline: none; pointer-events: none; }
    .cal-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; font-size: 11.5px; color: var(--ink-3); }
    .cal-foot .heat-legend { margin: 0; }

    /* 快速動作 */
    .quick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .quick a, .quick button { appearance: none; border: 0; font: inherit; text-align: left; cursor: pointer;
      display: flex; align-items: center; gap: 11px; padding: 12px 13px; border-radius: var(--radius-sm);
      background: var(--surface); box-shadow: var(--shadow-sm); color: var(--ink); transition: background-color .15s ease, transform .15s ease; }
    .quick a:hover, .quick button:hover { background: var(--surface-2); transform: translateY(-1px); }
    .quick i { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
    .quick i svg { width: 17px; height: 17px; }
    .quick b { display: block; font-size: 13.5px; }
    .quick small { display: block; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .quick .live { color: var(--accent); font-weight: 700; }

    .home-empty { padding: 60px 20px; }
    .month .card-title { margin-bottom: 6px; }
    .month-nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .month-nums div { min-width: 0; }
    .month-nums b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
    .month-nums span { font-size: 11.5px; color: var(--ink-3); }
    .month-up { color: var(--ok); font-weight: 700; } .month-down { color: var(--ink-3); }
    @media (max-width: 980px) {
      .home-grid { grid-template-columns: minmax(0, 1fr); }
      .home-hero { flex-wrap: wrap; }
    }
    @media (max-width: 760px) {
      .home { padding-block: 12px 32px; }
      .home-title { white-space: normal; }
      .latest-facts { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
      .latest-facts div { padding: 9px 10px; min-height: 0; }
      .latest-facts div:nth-child(5) { display: none; }
      .home-stats { width: 100%; grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .home-stat { min-width: 0; padding: 8px 10px; }
      .home-stat b { font-size: 17px; }
      .home-stat span { font-size: 10.5px; white-space: nowrap; display: block; overflow: hidden; text-overflow: ellipsis; }
    }
  </style>

<script>
const PLAY_SVG = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
let homeStats = null;

(async () => {
  await configReady;
  const user = await checkAuth();
  if (!user) return;
  renderHeader(user);
  setGreeting(user);
  try { homeStats = await apiFetch('/api/trips/stats'); } catch {}
  renderStats();
  loadLatest();
  loadHeatmap();
  loadJobsHint();
  document.getElementById('quick-random').addEventListener('click', openRandom);
})();

/** 依時段給問候語 + 使用者名。 */
function setGreeting(user) {
  const h = new Date().getHours();
  const g = h < 5 ? '夜深了' : h < 11 ? '早安' : h < 14 ? '午安' : h < 18 ? '午後好' : h < 22 ? '晚安' : '夜深了';
  const name = userDisplayName(user);
  document.getElementById('greeting').textContent = name ? `${g}，${name}` : g;
}

function renderStats() {
  const s = homeStats || {};
  const items = [
    [s.total_trips ?? 0, t('index.stat.trips')],
    [s.total_days ?? 0, t('index.stat.days')],
    [s.total_sec ? (s.total_sec / 3600).toFixed(1) : '0', t('index.stat.hours')],
    [s.max_gforce ? s.max_gforce.toFixed(2) + 'g' : '—', t('index.stat.gforce')],
  ];
  document.getElementById('home-stats').innerHTML = items.map(([v, l]) =>
    `<div class="home-stat"><b>${escapeHtml(String(v))}</b><span>${escapeHtml(l)}</span></div>`).join('');
}

/** 本機日期(YYYY-MM-DD);旅程日期為車機牆鐘日期。 */
function localToday() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function daysBetween(a, b) { return Math.round((Date.parse(a) - Date.parse(b)) / 86400000); }

/** 標題由資料決定:今天/昨天騎了幾趟,或距離上一趟幾天。 */
async function loadLatest() {
  const title = document.getElementById('home-title');
  const sub = document.getElementById('home-sub');
  const feature = document.getElementById('feature');
  let data;
  try { data = await apiFetch('/api/trips?limit=9&offset=0'); }
  catch (e) { feature.innerHTML = `<div class="empty"><h3>${t('common.loadFail')}</h3><p>${escapeHtml(e.message)}</p></div>`; return; }
  if (!data.trips.length) {
    title.innerHTML = '還沒有<em>任何旅程</em>';
    sub.innerHTML = `<a href="/upload">上傳第一批行車影片</a>`;
    feature.innerHTML = `<div class="empty home-empty panel-box"><div class="empty-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></div>
      <h3>${t('index.emptyTitle')}</h3><p>${t('index.emptyHint')}</p></div>`;
    document.getElementById('recent').closest('div').parentElement.querySelector('.recent').innerHTML = '';
    return;
  }
  const latest = data.trips[0];
  const sameDay = data.trips.filter(tr => tr.date === latest.date).length;
  const gap = daysBetween(localToday(), latest.date);
  if (gap <= 0) title.innerHTML = `今天騎了 <em>${sameDay}${sameDay >= 4 ? '+' : ''} 趟</em>`;
  else if (gap === 1) title.innerHTML = `昨天騎了 <em>${sameDay}${sameDay >= 4 ? '+' : ''} 趟</em>`;
  else title.innerHTML = `上一趟是 <em>${gap} 天前</em>`;

  const dateLabel = new Date(latest.date).toLocaleDateString(cfgLocale(), { month: 'long', day: 'numeric', weekday: 'short', timeZone: 'UTC' });
  const cams = [latest.has_front && t('trip.camFrontShort'), latest.has_rear && t('trip.camRearShort')].filter(Boolean).join('+') + t('trip.camSuffix');
  const device = latest.device && (latest.device.nickname || latest.device.model);
  const href = `/trip/${encodeURIComponent(latest.trip_id)}`;
  sub.innerHTML = `<span>${escapeHtml(dateLabel)} ${fmtTime(latest.start_epoch)}–${fmtTime(latest.end_epoch)} · ${fmtDuration(latest.duration_sec)}</span><a href="${href}">播放最新一趟</a>`;

  const meta = [cams, device, latest.peak_gforce > 0 ? `${latest.peak_gforce.toFixed(2)}g` : '', latest.bytes ? fmtBytes(latest.bytes) : '']
    .filter(Boolean).map(escapeHtml).join(' · ');
  feature.innerHTML = `
    <a class="feature" href="${href}">
      <img loading="eager" alt="" src="/video/${encodeURIComponent(latest.trip_id)}/thumbnail" onerror="this.remove()">
      <div class="feature-info">
        <div>
          <span class="feature-tag">最新一趟 · 第 ${latest.day_order} 趟</span>
          <h3>${escapeHtml(dateLabel)}　${fmtTime(latest.start_epoch)} — ${fmtTime(latest.end_epoch)}</h3>
          <p>${fmtDuration(latest.duration_sec)} · ${meta}</p>
        </div>
        <span class="play">${PLAY_SVG}</span>
      </div>
    </a>`;

  const facts = [
    [fmtDuration(latest.duration_sec), '長度'],
    [`${latest.segment_count || 0}`, '原始片段'],
    [latest.peak_gforce > 0 ? `${latest.peak_gforce.toFixed(2)}g` : '—', '最大 G 值'],
    [latest.bytes ? fmtBytes(latest.bytes) : '—', '檔案大小'],
    [device || '—', '記錄器'],
  ];
  document.getElementById('latest-facts').innerHTML = facts.map(([v, l]) =>
    `<div><b title="${escapeHtml(v)}">${escapeHtml(v)}</b><span>${escapeHtml(l)}</span></div>`).join('');

  document.getElementById('recent').innerHTML = data.trips.slice(1, 9).map(tr => `
    <a href="/trip/${encodeURIComponent(tr.trip_id)}">
      <span class="thumb"><img loading="lazy" alt="" src="/video/${encodeURIComponent(tr.trip_id)}/thumbnail" onerror="this.remove()"></span>
      <span class="txt"><b>${escapeHtml(new Date(tr.date).toLocaleDateString(cfgLocale(), { month: 'numeric', day: 'numeric', weekday: 'short', timeZone: 'UTC' }))} ${fmtTime(tr.start_epoch)}</b>
      <small>${fmtDuration(tr.duration_sec)}${tr.peak_gforce > 0 ? ` · ${tr.peak_gforce.toFixed(2)}g` : ''}</small></span>
      <span class="go" aria-hidden="true">›</span>
    </a>`).join('') || `<span style="font-size:13px;color:var(--ink-3)">只有一趟旅程</span>`;
  fitRecent();
}

/** 只顯示能完整放進側欄的最近旅程(避免最後一筆被切一半);手機/窄螢幕顯示前 4 筆。 */
function fitRecent() {
  const list = document.getElementById('recent');
  const rows = [...list.querySelectorAll('a')];
  list.closest('.recent-wrap').hidden = false;
  rows.forEach(r => { r.hidden = false; });
  const fit = getComputedStyle(list).overflow === 'hidden';
  if (!fit) { rows.forEach((r, i) => { r.hidden = i >= 4; }); return; }
  const bottom = list.getBoundingClientRect().bottom;
  let hide = false;
  rows.forEach(r => { if (!hide && r.getBoundingClientRect().bottom > bottom + 1) hide = true; r.hidden = hide; });
  list.closest('.recent-wrap').hidden = !rows.length || rows[0].hidden;
}
addEventListener('resize', () => { clearTimeout(window.__fitT); window.__fitT = setTimeout(fitRecent, 120); });

async function openRandom() {
  const total = homeStats?.total_trips || 0;
  if (!total) { location.href = '/upload'; return; }
  try {
    const data = await apiFetch(`/api/trips?limit=1&offset=${Math.floor(Math.random() * total)}`);
    if (data.trips[0]) location.href = `/trip/${encodeURIComponent(data.trips[0].trip_id)}`;
  } catch (e) { showToast(e.message, 'error'); }
}

async function loadJobsHint() {
  try {
    const jobs = await apiFetch('/api/jobs?offset=0');
    const active = jobs.filter(j => ['queued', 'running', 'cancelling'].includes(j.status)).length;
    const el = document.getElementById('quick-jobs');
    if (active) { el.textContent = `${active} 個處理中`; el.classList.add('live'); }
    else if (jobs[0]) el.textContent = `最近：${jobs[0].message || '已完成'}`;
  } catch {}
}

/** GitHub 風騎乘日曆(約半年)+ 連續騎乘統計。 */
async function loadHeatmap() {
  const grid = document.getElementById('heatmap');
  let dates = [];
  try { dates = await apiFetch('/api/trips/dates'); } catch { grid.innerHTML = ''; return; }
  const counts = new Map(dates.map(d => [d.date, d.trip_count || 0]));
  const lv = c => c >= 5 ? 3 : c >= 3 ? 2 : c >= 1 ? 1 : 0;
  const pad = n => String(n).padStart(2, '0');
  const DAY = 86400000;
  const WEEKS = 26;
  const now = new Date();
  const todayUTC = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  const endSat = todayUTC + (6 - new Date(todayUTC).getUTCDay()) * DAY;
  const startSun = endSat - (WEEKS * 7 - 1) * DAY;
  let cells = '', active = 0, trips = 0;
  for (let ms = startSun; ms <= endSat; ms += DAY) {
    const d = new Date(ms);
    const key = `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;
    if (ms > todayUTC) { cells += `<div class="heat-cell is-future"></div>`; continue; }
    const c = counts.get(key) || 0;
    if (c) { active++; trips += c; }
    const title = `${key} · ${c} ${t('index.stat.tripsUnit')}`;
    cells += c ? `<a class="heat-cell" data-lv="${lv(c)}" href="/browse#${key}" title="${title}"></a>`
               : `<div class="heat-cell" data-lv="0" title="${title}"></div>`;
  }
  grid.innerHTML = cells;
  let months = '', prevM = -1;
  for (let w = 0; w < WEEKS; w++) {
    const ws = new Date(startSun + w * 7 * DAY);
    const m = ws.getUTCMonth();
    let lbl = '';
    if (m !== prevM) { lbl = ws.toLocaleDateString(cfgLocale(), { month: 'short', timeZone: 'UTC' }); prevM = m; }
    months += `<span>${lbl}</span>`;
  }
  document.getElementById('cal-months').innerHTML = months;
  document.getElementById('cal-total').textContent = `近 ${WEEKS} 週 · ${active} 天 · ${trips} ${t('index.stat.tripsUnit')}`;
  // 最長連續騎乘天數
  const days = [...counts.keys()].sort();
  let best = 0, run = 0, prev = null;
  for (const d of days) { run = prev && daysBetween(d, prev) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = d; }
  document.getElementById('cal-streak').textContent = best > 1 ? `最長連續 ${best} 天` : '';
  renderMonth(dates);
}

/** 本月 vs 上月:天數、趟數、時數。 */
function renderMonth(dates) {
  const now = new Date();
  const ym = (y, m) => `${y}-${String(m + 1).padStart(2, '0')}`;
  const cur = ym(now.getFullYear(), now.getMonth());
  const prevDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const prev = ym(prevDate.getFullYear(), prevDate.getMonth());
  const sum = (key) => dates.filter(d => d.date.startsWith(key)).reduce((a, d) =>
    ({ days: a.days + 1, trips: a.trips + (d.trip_count || 0), sec: a.sec + (d.total_sec || 0) }), { days: 0, trips: 0, sec: 0 });
  const a = sum(cur), b = sum(prev);
  // 月初還沒騎時改看上個月,避免整塊都是 0
  const show = a.trips ? a : b;
  if (!show.trips) return;
  const label = a.trips ? '本月' : `${prevDate.getMonth() + 1} 月`;
  document.getElementById('month-title').textContent = label;
  document.getElementById('month-nums').innerHTML = [
    [show.trips, t('index.stat.tripsUnit')], [show.days, t('index.stat.daysUnit')], [(show.sec / 3600).toFixed(1), t('index.stat.hoursUnit')],
  ].map(([v, u]) => `<div><b>${v}</b><span>${escapeHtml(u)}</span></div>`).join('');
  if (a.trips && b.trips) {
    const diff = a.trips - b.trips;
    document.getElementById('month-compare').innerHTML = diff >= 0
      ? `<span class="month-up">比上月多 ${diff} 趟</span>` : `<span class="month-down">上月 ${b.trips} 趟</span>`;
  }
  document.getElementById('month-box').hidden = false;
  fitRecent();
}
