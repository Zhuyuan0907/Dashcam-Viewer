<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title data-i18n-title="title.browse">瀏覽旅程 — 行車記錄</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    /* ── 瀏覽旅程 · simple.taipei 風(scoped:全部吃全域 token,不動全域 CSS) ──────── */
    .browse-grid {
      display: grid; grid-template-columns: 244px 1fr;
      gap: clamp(22px, 3vw, 44px); align-items: start;
    }

    /* 日期軌(左,sticky)。overscroll-behavior:contain 讓軌內捲動不會「外溢」帶動整頁,
       解決日期軌與頁面雙重捲動互搶的問題。 */
    .daterail { position: sticky; top: calc(var(--hdr-h) + 16px);
      max-height: calc(100vh - var(--hdr-h) - 32px); overflow-y: auto; padding-right: 4px;
      overscroll-behavior: contain;
      scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
    .daterail::-webkit-scrollbar { width: 7px; }
    .daterail::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 99px; }
    .daterail::-webkit-scrollbar-track { background: transparent; }

    /* 手機入口顯示目前日期，點選後開啟時間回廊。 */
    .daterail-trigger { display: none; }

    /* 手機只顯示入口；日期與影片在時間回廊中選擇。 */
    @media (max-width: 760px) {
      .browse-grid { grid-template-columns: 1fr; gap: 14px; }
      .daterail { position: static; max-height: none; overflow: visible; padding-right: 0; }

      .daterail-trigger {
        display: flex; align-items: center; gap: 10px; width: 100%; box-sizing: border-box;
        padding: 13px 15px; margin: 0; font: inherit; font-size: 15px; font-weight: 600; line-height: 1.2;
        color: var(--ink); background: transparent;
        border: 1px solid var(--line); border-radius: var(--radius-sm);
        cursor: pointer; text-align: left;
        -webkit-tap-highlight-color: transparent; transition: border-color .15s ease, background-color .15s ease;
      }
      .daterail-trigger:active { transform: scale(.995); }
      .daterail-trigger:hover { border-color: var(--accent); }
      .daterail-trigger:disabled { opacity: .55; cursor: wait; }
      .daterail-trigger-ico { flex: none; color: var(--accent); }
      .daterail-trigger-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .daterail-trigger-chev { flex: none; color: var(--ink-3); }
      .daterail-panel { display: none; }
    }
    .daterail-title { font-size: 12px; font-weight: 600; letter-spacing: .04em;
      text-transform: uppercase; color: var(--ink-3); padding: 0 6px 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .tm-launch { border: 0; background: var(--accent-soft); color: var(--accent);
      border-radius: 99px; padding: 6px 10px; font: inherit; font-size: 11px;
      font-weight: 700; white-space: nowrap; cursor: pointer;
      transition: background-color .18s ease, transform .18s ease; }
    .tm-launch:hover { background: color-mix(in oklch, var(--accent) 20%, var(--surface)); transform: translateX(2px); }
    .tm-launch:disabled { opacity: .55; cursor: wait; transform: none; }
    .daterail ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }

    .drow { display: block; padding: 11px 13px; border-radius: var(--radius-sm);
      color: var(--ink-2); cursor: pointer; transition: background-color .15s ease, color .15s ease; }
    .drow:hover { background: var(--surface-2); color: var(--ink); }
    .drow.active { background: var(--accent-soft); color: var(--accent); }
    /* 緊急(紅色)列:hover / active 也要有對應的紅色色彩反應(與藍色一致) */
    .drow.emer:hover { background: color-mix(in oklch, var(--crit) 10%, var(--surface-2)); }
    .drow.emer.active { background: color-mix(in oklch, var(--crit) 14%, transparent); color: var(--crit); }
    .drow.emer.active .drow-date,
    .drow.emer.active .drow-count { color: var(--crit); }
    .drow.emer:hover .drow-fill { background: color-mix(in oklch, var(--crit) 80%, white); }
    .drow-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .drow-date { font-size: 14px; font-weight: 600; color: var(--ink); display: inline-flex; align-items: center; gap: 7px; }
    .drow.active .drow-date { color: var(--accent); }
    .drow-emer-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--crit); display: inline-block; flex-shrink: 0; }
    .drow-count { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .drow.active .drow-count { color: var(--accent); }
    .drow-bar { margin-top: 9px; height: 4px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
    .drow-fill { height: 100%; border-radius: 99px; background: var(--accent-line); min-width: 4px; transition: width .35s ease; }
    .drow:hover .drow-fill { background: var(--accent); }
    .drow.active .drow-fill { background: var(--accent); }
    .drow.emer .drow-fill { background: var(--crit); }

    /* 右側當日標頭 */
    .day-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .day-head h2 { font-size: clamp(19px, 2.6vw, 25px); font-weight: 700; letter-spacing: -.02em; }
    .day-meta { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-3); }
    .day-emer { font-size: 12px; font-weight: 700; color: var(--crit); display: inline-flex; align-items: center; gap: 5px; }

    /* 搖晃標示(以 G 值;EMER 偵測關閉後使用) */
    .drow-shake-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .drow.shake-warn .drow-shake-dot { background: var(--warn); }
    .drow.shake-crit .drow-shake-dot { background: var(--crit); }
    .day-shake { font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; }
    .day-shake.warn { color: var(--warn); }
    .day-shake.crit { color: var(--crit); }
    .day-shake-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; display: inline-block; flex-shrink: 0; }

    /* 使用者(旅程擁有者)選單 —— 沿用全域 .form-input.form-select 外觀,保持一致 */
    .owner-bar { display: flex; align-items: center; gap: 10px; margin: 4px 0 18px; flex-wrap: wrap; }
    .owner-bar label { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); }
    /* 透明底色 + 淡邊框的下拉 */
    .owner-select { width: auto; min-width: 200px; cursor: pointer; font-weight: 600; color: var(--ink);
      background-color: transparent; border-color: var(--line);
      transition: background-color .15s ease, border-color .15s ease; }
    .owner-select:hover, .owner-select:focus { background-color: var(--surface); border-color: var(--accent); }

    /* 無旅程時:整區置中(隱藏空的日期軌),讓提示 / 選人選單置於正中 */
    .browse-grid.is-empty { display: flex; align-items: center; justify-content: center; }
    .browse-grid.is-empty .daterail { display: none; }
    .browse-grid.is-empty #trip-content { height: auto; overflow: visible; width: 100%; max-width: 560px; padding-right: 0; }
    /* 空狀態:收起頁面標題區,讓選人選單置於整個頁面的正中央 */
    #browse-wrap.is-empty-page > .sec-eyebrow,
    #browse-wrap.is-empty-page > .page-title,
    #browse-wrap.is-empty-page > .page-sub { display: none; }

    /* 選人選單卡 */
    .owner-picker { text-align: center; padding: 40px 24px; }
    .owner-picker .op-icon { width: 52px; height: 52px; margin: 0 auto 16px; border-radius: 16px;
      background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; }
    .owner-picker h3 { font-size: 19px; font-weight: 700; margin-bottom: 6px; }
    .owner-picker p { font-size: 14px; color: var(--ink-3); margin-bottom: 20px; }
    .op-list { display: flex; flex-direction: column; gap: 8px; max-width: 340px; margin: 0 auto 18px; }
    .op-item { display: flex; align-items: center; gap: 12px; width: 100%; box-sizing: border-box;
      padding: 12px 14px; font: inherit; text-align: left; cursor: pointer;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm);
      box-shadow: var(--shadow-sm); transition: border-color .15s ease, background-color .15s ease; }
    .op-item:hover { border-color: var(--accent); background: var(--surface-2); }
    .op-avatar { width: 32px; height: 32px; flex: none; border-radius: 50%; background: var(--accent-soft);
      color: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
    .op-name { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .op-go { flex: none; color: var(--ink-3); }

    /* ── 桌機:整頁不需捲動,左右兩欄各自內部捲動;整頁捲動只會露出 footer ── */
    @media (min-width: 761px) {
      .page-body { height: 100dvh; box-sizing: border-box; overflow: hidden; }
      .section-tight { height: 100%; box-sizing: border-box; display: flex; flex-direction: column; min-height: 0; }
      .browse-grid { flex: 1; min-height: 0; }
      .daterail { position: static; top: auto; max-height: none; height: 100%; min-height: 0; overflow-y: auto; }
      #trip-content { height: 100%; min-height: 0; overflow-y: auto; padding-right: 6px;
        scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
      #trip-content::-webkit-scrollbar { width: 7px; }
      #trip-content::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 99px; }
    }

    /* 日期時間回廊：有內容的視窗沿深度排列，橫向手勢穿梭日期。 */
    body.tm-open { overflow: hidden; }
    .time-machine[hidden] { display: none; }
    .time-machine { position: fixed; inset: 0; z-index: 1000; overflow: hidden;
      color: #f5f8f7; background: radial-gradient(ellipse at 50% 42%, rgba(182,193,192,.68), rgba(76,88,90,.9) 55%, #303b3f 100%);
      backdrop-filter: blur(24px) grayscale(.8); -webkit-backdrop-filter: blur(24px) grayscale(.8); }
    .time-machine::before { content: ''; position: absolute; inset: -25%; pointer-events: none;
      background: repeating-radial-gradient(ellipse at 50% 47%, transparent 0 86px, rgba(255,255,255,.09) 87px 89px, transparent 90px 160px);
      mask-image: radial-gradient(ellipse at center, black 25%, transparent 72%); transform: perspective(800px) rotateX(15deg); }
    .tm-shell { position: relative; display: grid; grid-template-rows: auto minmax(0,1fr) auto auto;
      width: 100%; height: 100dvh; min-height: 0; box-sizing: border-box; padding: max(14px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left)); }
    .tm-header { display: flex; align-items: start; justify-content: space-between; gap: 16px; z-index: 3; max-width: 1100px; width: 100%; margin: 0 auto; }
    .tm-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .15em; color: #d2e5e0; }
    .tm-header h2 { margin: 4px 0 0; font-size: clamp(23px, 3vw, 34px); line-height: 1.2; text-shadow: 0 2px 14px #304044; }
    .tm-hint { margin: 6px 0 0; font-size: 12px; color: #e1e9e7; }
    .tm-close { display: grid; place-items: center; flex: none; width: 40px; height: 40px;
      border: 1px solid rgba(255,255,255,.45); border-radius: 50%; background: rgba(25,39,41,.4);
      color: white; font-size: 24px; cursor: pointer; }
    .tm-close:hover { background: rgba(25,39,41,.7); }
    .tm-stage { position: relative; min-height: 0; width: 100%; perspective: 1050px; perspective-origin: 50% 45%;
      overflow: hidden; touch-action: pan-y; cursor: grab; isolation: isolate; user-select: none; }
    .tm-stage.dragging { cursor: grabbing; }
    .tm-stage::before { content: ''; position: absolute; width: min(92vw, 1080px); height: min(78vh, 700px);
      left: 50%; top: 48%; transform: translate(-50%,-50%); border-radius: 50%; pointer-events: none;
      background: radial-gradient(ellipse, rgba(238,247,243,.29), rgba(203,221,216,.08) 45%, transparent 72%); }
    .tm-card { position: absolute; left: 50%; top: 51%; width: min(760px, calc(100vw - 72px));
      height: min(58dvh, 525px); min-height: 280px; box-sizing: border-box; display: flex; flex-direction: column;
      overflow: hidden; border: 1px solid rgba(255,255,255,.8); border-radius: 13px;
      background: #eef2f0; color: #203033; box-shadow: 0 26px 70px rgba(10,23,27,.38), 0 0 0 1px rgba(18,49,48,.14);
      backface-visibility: hidden; transform-style: preserve-3d; }
    .tm-card[aria-current="date"] { box-shadow: 0 30px 90px rgba(10,23,27,.5), 0 0 0 1px rgba(255,255,255,.75); }
    .tm-stage.settling .tm-card { transition: transform .48s cubic-bezier(.18,.8,.22,1), opacity .4s ease, filter .4s ease; }
    .tm-window-head { flex: none; display: flex; align-items: center; gap: 14px; min-height: 64px;
      box-sizing: border-box; padding: 11px 20px; border-bottom: 1px solid #cbd7d3;
      background: linear-gradient(#f7f9f8,#e2eae7); }
    .tm-window-dots { display: flex; flex: none; gap: 6px; align-self: start; padding-top: 9px; }
    .tm-window-dots i { width: 9px; height: 9px; border-radius: 50%; background: #bdccca; box-shadow: inset 0 1px 2px #9baaa7; }
    .tm-window-dots i:first-child { background: #bd7775; }
    .tm-window-dots i:nth-child(2) { background: #c6a76b; }
    .tm-window-title { min-width: 0; }
    .tm-window-title strong { display: block; font-size: clamp(16px, 2.2vw, 22px); line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tm-window-title small { display: block; margin-top: 3px; font-size: 12px; color: #526b67; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tm-window-body { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; touch-action: pan-y;
      padding: 19px; scrollbar-width: thin; scrollbar-color: #b1c4bf transparent; }
    .tm-window-body .trips-grid { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 13px; }
    .tm-window-body .trip-card { background: #fff; }
    .tm-window-body .loading-row { min-height: 120px; }
    .tm-empty { padding: 28px 8px; color: #526b67; font-size: 13px; }
    .tm-window-foot { flex: none; padding: 10px 20px; border-top: 1px solid #d5dfdc;
      color: #5b716d; font-size: 11px; background: #e9efed; }
    .tm-timeline { position: relative; z-index: 3; width: min(100%, 850px); margin: 0 auto; padding: 0 0 4px; }
    .tm-timeline-top { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin-bottom: 6px; }
    .tm-current-date { font-size: 15px; font-weight: 700; text-shadow: 0 1px 8px #344446; }
    .tm-position { font: 12px var(--font-mono); color: #d3e2df; white-space: nowrap; }
    .tm-range-row { display: flex; align-items: center; gap: 13px; font-size: 11px; color: #e5efec; }
    .tm-range-row span { flex: none; }
    .tm-range { flex: 1; min-width: 0; height: 26px; accent-color: #e4fff7; cursor: pointer; }
    .tm-footer { position: relative; z-index: 3; display: flex; align-items: center; justify-content: center; gap: 10px; padding-top: 10px; }
    .tm-footer button { border: 1px solid rgba(255,255,255,.48); border-radius: 99px;
      padding: 9px 17px; background: rgba(26,43,43,.44); color: #fff;
      font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
    .tm-footer .tm-open-day { background: #e7f7f1; border-color: #e7f7f1; color: #1b5e53; }
    .tm-footer button:hover { filter: brightness(1.1); }
    .tm-stage:focus-visible, .tm-close:focus-visible, .tm-footer button:focus-visible,
    .tm-range:focus-visible, .tm-window-body a:focus-visible { outline: 3px solid #bbfff0; outline-offset: 3px; }
    @media (max-width: 760px) {
      .tm-shell { padding-left: max(12px,env(safe-area-inset-left)); padding-right: max(12px,env(safe-area-inset-right)); }
      .tm-header h2 { font-size: 23px; }
      .tm-hint { max-width: 260px; line-height: 1.4; }
      .tm-card { width: calc(100vw - 30px); height: min(60dvh, 535px); min-height: 280px; }
      .tm-window-head { min-height: 60px; padding: 10px 13px; gap: 10px; }
      .tm-window-body { padding: 12px; }
      .tm-window-body .trips-grid { grid-template-columns: minmax(0,1fr); gap: 10px; }
      .tm-window-foot { padding: 8px 13px; }
      .tm-current-date { font-size: 13px; }
    }
    @media (max-height: 600px) {
      .tm-shell { padding-top: 8px; padding-bottom: 8px; }
      .tm-hint, .tm-window-foot { display: none; }
      .tm-card { height: min(54dvh, 320px); min-height: 170px; }
      .tm-window-head { min-height: 46px; padding-top: 6px; padding-bottom: 6px; }
      .tm-footer { padding-top: 5px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .tm-stage.settling .tm-card { transition: none; }
    }
  </style>
<script src="/static/themes.js"></script><link rel="stylesheet" href="/static/themes.css?v=2.1.2"></head>
<body>

<header class="hdr">
  <div class="wrap hdr-inner">
    <a class="hdr-brand" href="/">
      <div class="hdr-brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></div>
      <span class="hdr-brand-text">行車記錄</span>
    </a>
    <nav class="hdr-nav">
      <a class="hdr-link" data-href="/" href="/" data-i18n="nav.home">首頁</a>
      <a class="hdr-link" data-href="/browse" href="/browse" data-i18n="nav.browse">瀏覽旅程</a>
      <a class="hdr-link" data-href="/clips" href="/clips" data-i18n="nav.clips">片段</a>
      <a class="hdr-link" data-href="/upload" href="/upload" data-i18n="nav.upload">上傳</a>
      <a class="hdr-link admin-only" data-href="/admin" href="/admin" style="display:none" data-i18n="nav.admin">管理</a>
      <a class="hdr-link admin-only" data-href="/ops" href="/ops" style="display:none" data-i18n="nav.ops">維運</a>
    </nav>
    <div class="hdr-ctrls" id="hdr-ctrls"></div>
  </div>
</header>

<div class="page-body">
  <div class="wrap section-tight" id="browse-wrap">

    <div class="eyebrow sec-eyebrow rise"><span class="tick"></span><span data-i18n="nav.browse">瀏覽旅程</span></div>
    <h1 class="page-title rise rise-2" data-i18n="browse.title">瀏覽旅程</h1>
    <p class="page-sub rise rise-2" data-i18n="browse.sub">所有已整理的行車紀錄，依日期分類</p>

    <div class="owner-bar rise rise-2" id="owner-bar" style="display:none;">
      <label for="owner-select" data-i18n="browse.ownerPick">選擇使用者</label>
      <select class="form-input form-select owner-select" id="owner-select" onchange="onOwnerChange()"></select>
    </div>

    <div class="browse-grid rise rise-3">
      <aside class="daterail" id="daterail">
        <button class="daterail-trigger" id="daterail-trigger" type="button" disabled
                aria-haspopup="dialog" aria-controls="time-machine" onclick="openTimeMachine()">
          <svg class="daterail-trigger-ico" width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>
          <span class="daterail-trigger-label" id="daterail-current" data-i18n="common.loading">載入中…</span>
          <svg class="daterail-trigger-chev" width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
        </button>
        <div class="daterail-panel" id="daterail-panel">
          <div class="daterail-title"><span data-i18n="browse.dateHeading">日期</span>
            <button class="tm-launch" type="button" disabled aria-haspopup="dialog" aria-controls="time-machine" onclick="openTimeMachine()">時間回廊 ↗</button></div>
          <ul id="date-list">
            <li><div class="loading-row" style="padding:14px;"><div class="spinner"></div></div></li>
          </ul>
        </div>
      </aside>
      <main id="trip-content">
        <div class="loading-row"><div class="spinner"></div><span data-i18n="common.loading">載入中…</span></div>
      </main>
    </div>

  </div>
</div>

<div class="time-machine" id="time-machine" role="dialog" aria-modal="true" aria-labelledby="tm-title" hidden>
  <div class="tm-shell">
    <div class="tm-header">
      <div><span class="tm-eyebrow">旅程時間回廊</span><h2 id="tm-title">穿梭旅程時光</h2>
        <p class="tm-hint">左右滑動觸控板、拖曳視窗，或按方向鍵切換日期</p></div>
      <button class="tm-close" id="tm-close" type="button" aria-label="關閉日期瀏覽" onclick="closeTimeMachine()">×</button>
    </div>
    <div class="tm-stage" id="tm-stage" tabindex="0" aria-label="左右滑動選擇日期"></div>
    <div class="tm-timeline"><div class="tm-timeline-top"><span class="tm-current-date" id="tm-current-date" aria-live="polite"></span><span class="tm-position" id="tm-position"></span></div>
      <div class="tm-range-row"><span>最近</span><input class="tm-range" id="tm-range" type="range" min="0" max="0" value="0" aria-label="日期位置"><span>最早</span></div></div>
    <div class="tm-footer"><button type="button" onclick="closeTimeMachine()">返回</button>
      <button type="button" class="tm-open-day" id="tm-open-day">查看此日旅程</button></div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/static/app.js?v=2.1.3"></script>
<script>
let allDates = [];
let currentOwner = null;   // 目前瀏覽的旅程擁有者 id
let selfId = null;
let ownersList = [];       // 可瀏覽的旅程擁有者

(async () => {
  await configReady;
  const user = await checkAuth();
  if (!user) return;   // 未登入/強制改密碼:checkAuth 已轉址,別再解參考 null
  renderHeader(user);
  selfId = user.id;
  currentOwner = user.id;
  await loadOwners();
  loadDates();
})();

/** 載入可瀏覽的旅程擁有者,填入選單;只有自己一個時隱藏。 */
async function loadOwners() {
  let owners;
  try { owners = await apiFetch('/api/trip-owners'); } catch { return; }
  // 確保「我的旅程」永遠可選(即使自己還沒有旅程)
  if (!owners.some(o => o.is_self)) {
    owners.unshift({ id: selfId, username: '', name: '', is_self: true });
  }
  ownersList = owners;
  const requestedOwner = Number.parseInt(new URLSearchParams(location.search).get('owner') || '', 10);
  if (Number.isInteger(requestedOwner) && owners.some(o => o.id === requestedOwner)) {
    currentOwner = requestedOwner;
  }
  const bar = document.getElementById('owner-bar');
  const sel = document.getElementById('owner-select');
  sel.innerHTML = owners.map(o =>
    `<option value="${o.id}">${o.is_self ? escapeHtml(t('browse.ownerMine')) : escapeHtml(t('browse.ownerOf', { name: o.name || o.username }))}</option>`
  ).join('');
  sel.value = String(currentOwner);
  bar.style.display = owners.length > 1 ? 'flex' : 'none';
}

/** 其他(非自己)可瀏覽的擁有者。 */
function otherOwners() { return ownersList.filter(o => !o.is_self); }

function onOwnerChange() {
  const sel = document.getElementById('owner-select');
  currentOwner = parseInt(sel.value, 10);
  const url = new URL(location.href);
  url.searchParams.set('owner', String(currentOwner));
  history.replaceState(null, '', url.pathname + url.search);
  location.hash = '';
  loadDates();
}

/** 由選單卡點選某位使用者 → 切換並載入。 */
function selectOwner(id) {
  currentOwner = id;
  const url = new URL(location.href);
  url.searchParams.set('owner', String(currentOwner));
  history.replaceState(null, '', url.pathname + url.search);
  const sel = document.getElementById('owner-select');
  if (sel) sel.value = String(id);
  location.hash = '';
  loadDates();
}

/** 目前擁有者沒有旅程:整區置中,優先顯示「選擇使用者」選單(若有他人公開),否則顯示上傳提示。 */
function renderEmpty() {
  const grid = document.querySelector('.browse-grid');
  grid.classList.add('is-empty');
  document.getElementById('browse-wrap').classList.add('is-empty-page');
  document.getElementById('date-list').innerHTML = '';
  const content = document.getElementById('trip-content');
  const others = otherOwners();

  // 只在瀏覽「自己」且有他人公開旅程時,優先跳出選人選單。
  if (currentOwner === selfId && others.length) {
    // 選人選單本身已含所有對象,頂部「選擇使用者」列重複,隱藏之並讓選單上移。
    document.getElementById('owner-bar').style.display = 'none';
    const items = others.map(o => {
      const nm = o.name || o.username;
      const initial = (nm[0] || '?').toUpperCase();
      return `<button class="op-item" onclick="selectOwner(${o.id})">
        <span class="op-avatar">${initial}</span>
        <span class="op-name">${escapeHtml(nm)}</span>
        <svg class="op-go" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>`;
    }).join('');
    content.innerHTML = `<div class="owner-picker">
      <div class="op-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
      <h3>${t('browse.pickTitle')}</h3>
      <p>${t('browse.pickHint')}</p>
      <div class="op-list">${items}</div>
      <a class="btn btn--ghost btn--sm" href="/upload">${t('browse.uploadCta')}</a>
    </div>`;
    return;
  }

  // 否則:置中的空狀態(含上傳按鈕);頂部選單維持預設可見性(便於切回其他人)。
  document.getElementById('owner-bar').style.display = ownersList.length > 1 ? 'flex' : 'none';
  content.innerHTML = `<div class="empty">
    <div class="empty-icon">${camIcon()}</div>
    <h3>${t('browse.emptyTitle')}</h3>
    <p>${t('browse.emptyHint')}</p>
    <a class="btn btn--solid btn--sm" href="/upload" style="margin-top:16px;">${t('browse.uploadCta')}</a>
  </div>`;
}

/** 攝影機空狀態圖示。 */
function camIcon(size = 22) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>`;
}

/** 日期短標籤(如「6/24 週二」),清單與手機下拉觸發鈕共用。 */
function dateShortLabel(date) {
  return new Date(date).toLocaleDateString(cfgLocale(),
    { month: 'numeric', day: 'numeric', weekday: 'short', timeZone: 'UTC' });
}

/* ── 日期時間回廊：拖曳 / 觸控板滾動會逐格滑動，放手後吸附日期。 ───────────── */
const tmDialog = document.getElementById('time-machine');
const tmStage = document.getElementById('tm-stage');
const tmRange = document.getElementById('tm-range');
let tmPosition = 0;
let tmIndex = 0;
let tmDrag = null;
let tmWheelTimer = null;
let tmPreviewSeq = 0;
let tmPreviousFocus = null;
let tmSuppressClick = false;
const tmPreviewCache = new Map();

function tmClamp(index) { return Math.max(0, Math.min(allDates.length - 1, index)); }
function tmLongDate(date) {
  return new Date(date).toLocaleDateString(cfgLocale(),
    { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long', timeZone: 'UTC' });
}
function setTimeMachineReady(ready) {
  document.querySelectorAll('#daterail-trigger, .tm-launch').forEach(button => { button.disabled = !ready; });
}
function renderTimeMachine(animate = false) {
  tmStage.classList.toggle('settling', animate);
  const focus = Math.round(tmPosition);
  const mobile = innerWidth <= 760;
  tmStage.querySelectorAll('.tm-card').forEach((card, index) => {
    const distance = index - tmPosition;
    const behind = Math.max(0, distance);
    const passed = Math.max(0, -distance);
    const visible = distance > -1.4 && distance < 4.1;
    if (!visible) {
      if (card.style.visibility !== 'hidden') {
        card.style.visibility = 'hidden';
        card.style.opacity = '0';
        card.style.pointerEvents = 'none';
        card.inert = true;
        card.setAttribute('aria-hidden', 'true');
        card.removeAttribute('aria-current');
      }
      return;
    }
    card.style.visibility = 'visible';
    card.style.opacity = String(passed ? Math.max(0, 1 - passed * 1.3) : Math.max(.23, 1 - behind * .18));
    card.style.filter = `blur(${Math.min(behind * .65, 2.5)}px)`;
    card.style.zIndex = String(index === focus ? 100 : distance >= 0 ? Math.round(90 - behind * 10) : Math.round(40 - passed * 10));
    card.style.transform = `translate(-50%, -50%) translate3d(${behind * (mobile ? 18 : 45) - passed * (mobile ? 310 : 750)}px, ${-behind * (mobile ? 105 : 120)}px, ${-behind * 165 + passed * 60}px) rotateY(${-behind * 2 - passed * 13}deg) scale(${Math.max(.69, 1 - behind * .07)})`;
    card.style.pointerEvents = index === focus ? 'auto' : 'none';
    card.inert = index !== focus;
    card.setAttribute('aria-hidden', index === focus ? 'false' : 'true');
    if (index === focus) card.setAttribute('aria-current', 'date');
    else card.removeAttribute('aria-current');
  });
  tmRange.value = String(focus);
  const date = allDates[focus]?.date;
  document.getElementById('tm-current-date').textContent = date ? tmLongDate(date) : '';
  document.getElementById('tm-position').textContent = `${focus + 1} / ${allDates.length}`;
}
async function loadTimeMachinePreview(index) {
  const seq = tmPreviewSeq;
  const date = allDates[index]?.date;
  if (!date || tmDialog.hidden) return;
  const body = tmStage.querySelector(`.tm-card[data-index="${index}"] .tm-window-body`);
  if (!body || body.dataset.loaded === 'true') return;
  const key = `${currentOwner}:${date}`;
  try {
    let data = tmPreviewCache.get(key);
    if (!data) {
      data = apiFetch(`/api/trips?date=${encodeURIComponent(date)}&owner=${encodeURIComponent(currentOwner)}&limit=12&offset=0`);
      tmPreviewCache.set(key, data);
    }
    data = await data;
    tmPreviewCache.set(key, data);
    if (seq !== tmPreviewSeq || tmDialog.hidden || !body.isConnected) return;
    body.innerHTML = data.trips.length
      ? `<div class="trips-grid">${data.trips.slice(0, 6).map(renderTripCard).join('')}</div>`
      : `<div class="tm-empty">${t('browse.noTripThisDay')}</div>`;
    body.dataset.loaded = 'true';
    body.scrollTop = 0;
  } catch (error) {
    tmPreviewCache.delete(key);
    if (seq === tmPreviewSeq && !tmDialog.hidden && body.isConnected)
      body.innerHTML = `<div class="tm-empty">${t('common.loadFail')}：${escapeHtml(error.message)}</div>`;
  }
}
function loadNearbyTimeMachineTrips(index) {
  [index, index - 1, index + 1].forEach(i => { if (i >= 0 && i < allDates.length) void loadTimeMachinePreview(i); });
}
function settleTimeMachine(index, animate = true) {
  if (!allDates.length) return;
  const next = tmClamp(Math.round(index));
  const changed = next !== tmIndex;
  if (changed && document.activeElement?.closest('.tm-card')) tmStage.focus();
  tmPosition = next;
  tmIndex = next;
  renderTimeMachine(animate);
  if (changed) loadNearbyTimeMachineTrips(next);
}
function openTimeMachine() {
  if (!allDates.length || !tmDialog.hidden) return;
  tmPreviousFocus = document.activeElement;
  tmDialog.hidden = false;
  document.body.classList.add('tm-open');
  document.querySelector('header.hdr').inert = true;
  document.querySelector('.page-body').inert = true;
  const selected = decodeURIComponent(location.hash.slice(1));
  tmIndex = Math.max(0, allDates.findIndex(d => d.date === selected));
  tmPosition = tmIndex;
  tmStage.innerHTML = allDates.map((entry, index) => {
    return `<div class="tm-card" data-index="${index}" role="group" aria-label="${escapeHtml(tmLongDate(entry.date))}，${entry.trip_count} 趟">
      <div class="tm-window-head"><span class="tm-window-dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="tm-window-title"><strong>${escapeHtml(tmLongDate(entry.date))}</strong><small>${entry.trip_count} 趟旅程 · ${fmtDuration(entry.total_sec || 0)}</small></span></div>
      <div class="tm-window-body"><div class="loading-row"><div class="spinner"></div>${t('common.loading')}</div></div>
      <div class="tm-window-foot">${escapeHtml(entry.date)} · 旅程記錄</div></div>`;
  }).join('');
  tmRange.max = String(Math.max(0, allDates.length - 1));
  tmRange.disabled = allDates.length < 2;
  renderTimeMachine();
  loadNearbyTimeMachineTrips(tmIndex);
  tmStage.focus();
}
function closeTimeMachine() {
  if (tmDialog.hidden) return;
  clearTimeout(tmWheelTimer);
  ++tmPreviewSeq;
  tmDialog.hidden = true;
  document.body.classList.remove('tm-open');
  document.querySelector('header.hdr').inert = false;
  document.querySelector('.page-body').inert = false;
  tmPreviousFocus?.focus();
}

tmStage.addEventListener('wheel', event => {
  if (tmDialog.hidden || allDates.length < 2) return;
  if (event.target.closest('.tm-window-body') && Math.abs(event.deltaY) > Math.abs(event.deltaX)) return;
  event.preventDefault();
  clearTimeout(tmWheelTimer);
  const delta = Math.abs(event.deltaX) > Math.abs(event.deltaY) ? event.deltaX : event.deltaY;
  tmPosition = tmClamp(tmPosition + Math.max(-1.2, Math.min(1.2, delta / 210)));
  renderTimeMachine();
  tmWheelTimer = setTimeout(() => settleTimeMachine(tmPosition), 150);
}, { passive: false });
tmStage.addEventListener('pointerdown', event => {
  if (event.button !== 0 || allDates.length < 2) return;
  clearTimeout(tmWheelTimer);
  tmDrag = { id: event.pointerId, x: event.clientX, start: tmPosition, moved: false };
});
tmStage.addEventListener('pointermove', event => {
  if (!tmDrag || event.pointerId !== tmDrag.id) return;
  const distance = event.clientX - tmDrag.x;
  if (!tmDrag.moved && Math.abs(distance) < 5) return;
  if (!tmDrag.moved) {
    tmDrag.moved = true;
    tmStage.setPointerCapture(event.pointerId);
    tmStage.classList.add('dragging');
  }
  tmPosition = tmClamp(tmDrag.start - distance / Math.min(tmStage.clientWidth * .55, 290));
  renderTimeMachine();
});
function endTimeMachineDrag(event) {
  if (!tmDrag || event.pointerId !== tmDrag.id) return;
  if (tmDrag.moved) {
    tmSuppressClick = true;
    setTimeout(() => { tmSuppressClick = false; }, 120);
    settleTimeMachine(tmPosition);
  }
  tmDrag = null;
  tmStage.classList.remove('dragging');
  if (tmStage.hasPointerCapture(event.pointerId)) tmStage.releasePointerCapture(event.pointerId);
}
tmStage.addEventListener('pointerup', endTimeMachineDrag);
tmStage.addEventListener('pointercancel', endTimeMachineDrag);
tmStage.addEventListener('click', event => {
  if (tmSuppressClick) { event.preventDefault(); tmSuppressClick = false; return; }
  if (event.target.closest('a')) return;
  const card = event.target.closest('.tm-card');
  if (card) settleTimeMachine(Number(card.dataset.index));
});
tmStage.addEventListener('keydown', event => {
  const move = { ArrowLeft: -1, ArrowRight: 1, Home: -Infinity, End: Infinity }[event.key];
  if (move === undefined) return;
  event.preventDefault();
  settleTimeMachine(Number.isFinite(move) ? tmIndex + move : move < 0 ? 0 : allDates.length - 1);
});
tmRange.addEventListener('input', () => { tmPosition = Number(tmRange.value); renderTimeMachine(); });
tmRange.addEventListener('change', () => settleTimeMachine(Number(tmRange.value)));
document.getElementById('tm-open-day').addEventListener('click', () => {
  const date = allDates[tmIndex]?.date;
  if (date) selectDate(date);
  closeTimeMachine();
});
tmDialog.addEventListener('click', event => { if (event.target === tmDialog) closeTimeMachine(); });
tmDialog.addEventListener('keydown', event => {
  if (event.key === 'Escape') { event.preventDefault(); closeTimeMachine(); return; }
  if (event.key !== 'Tab') return;
  const focusable = [...tmDialog.querySelectorAll('button:not([disabled]):not([tabindex="-1"]), input:not([disabled]), a[href], [tabindex="0"]')]
    .filter(element => !element.closest('[inert]') && element.getClientRects().length);
  const first = focusable[0], last = focusable[focusable.length - 1];
  if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
  else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
});

async function loadDates() {
  const list = document.getElementById('date-list');
  const grid = document.querySelector('.browse-grid');
  setTimeMachineReady(false);
  try {
    allDates = await apiFetch('/api/trips/dates?owner=' + encodeURIComponent(currentOwner));
    tmPreviewCache.clear();

    if (!allDates.length) { renderEmpty(); return; }
    setTimeMachineReady(true);
    grid.classList.remove('is-empty');
    document.getElementById('browse-wrap').classList.remove('is-empty-page');
    // 正常檢視:依可選對象多寡顯示頂部選單。
    document.getElementById('owner-bar').style.display = ownersList.length > 1 ? 'flex' : 'none';

    // 密度條:當日總時長相對全期最大值;含緊急鎖檔的日期標紅。
    const maxSec = Math.max(1, ...allDates.map(d => d.total_sec || 0));
    list.innerHTML = allDates.map(d => {
      const label = dateShortLabel(d.date);
      const w = Math.max(5, Math.round((d.total_sec || 0) / maxSec * 100));
      // EMER 偵測關閉後改以 G 值標示搖晃:強烈(紅)=仍有 EMER 或 ≥2.5g;
      // 搖晃(琥珀)=分析器標記的高G事件,或最高 G ≥1.8。
      const gmax = d.max_gforce || 0;
      const gev = d.gforce_events || 0;
      const lvl = ((d.emer_count || 0) > 0 || gmax >= 2.5) ? 'shake-crit'
                : (gev > 0 || gmax >= 1.8) ? 'shake-warn' : '';
      const dot = lvl ? `<span class="drow-shake-dot" title="最高 ${gmax.toFixed(2)}g${gev ? ` · 高G事件 ${gev}` : ''}"></span>` : '';
      return `<li><a class="drow${lvl ? ' ' + lvl : ''}" href="#${d.date}" data-date="${d.date}"
                    onclick="selectDate('${d.date}');return false;">
        <div class="drow-top">
          <span class="drow-date">${dot}${label}</span>
          <span class="drow-count">${d.trip_count} · ${fmtDuration(d.total_sec || 0)}</span>
        </div>
        <div class="drow-bar"><div class="drow-fill" style="width:${w}%"></div></div>
      </a></li>`;
    }).join('');

    const hash = decodeURIComponent(location.hash.slice(1));
    selectDate((hash && allDates.find(d => d.date === hash)) ? hash : allDates[0].date);
  } catch (e) {
    list.innerHTML = `<li style="padding:12px;color:var(--ink-3);font-size:13px;">${t('common.loadFail')}：${escapeHtml(e.message)}</li>`;
  }
}

let selectSeq = 0;   // 請求序號:快速連點日期/切換使用者時,慢的舊回應不可覆蓋新內容

async function selectDate(date, offset=0) {
  const seq = ++selectSeq;
  location.hash = date;
  document.querySelectorAll('#date-list .drow').forEach(a =>
    a.classList.toggle('active', a.dataset.date === date));
  // 手機入口顯示目前日期。
  const cur = document.getElementById('daterail-current');
  if (cur) { cur.textContent = dateShortLabel(date); cur.removeAttribute('data-i18n'); }
  document.getElementById('daterail-trigger').setAttribute('aria-label',
    `${dateShortLabel(date)}，開啟時間回廊選擇日期`);

  const content = document.getElementById('trip-content');
  content.innerHTML = `<div class="loading-row"><div class="spinner"></div>${t('common.loading')}</div>`;

  try {
    const data = await apiFetch(`/api/trips?date=${encodeURIComponent(date)}&owner=${encodeURIComponent(currentOwner)}&limit=100&offset=${offset}`);
    if (seq !== selectSeq) return;   // 已有更新的選取,丟棄本回應
    const label = new Date(date).toLocaleDateString(cfgLocale(),
      { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long', timeZone: 'UTC' });
    const totalSec = data.trips.reduce((s, tr) => s + tr.duration_sec, 0);
    const emerTotal = data.trips.reduce((s, tr) => s + (tr.emer_count || 0), 0);
    const emerTag = emerTotal > 0
      ? `<span class="day-emer"><span class="drow-emer-dot"></span>EMER ×${emerTotal}</span>`
      : '';
    // 搖晃標示(以 G 值):有高G事件或最高 G ≥1.8 的趟數 + 當日最高 G
    const gPeak = data.trips.reduce((m, tr) => Math.max(m, tr.peak_gforce || 0), 0);
    const shakeN = data.trips.filter(tr => (tr.gforce_events || 0) > 0 || (tr.peak_gforce || 0) >= 1.8).length;
    const shakeTag = shakeN > 0
      ? `<span class="day-shake ${gPeak >= 2.5 ? 'crit' : 'warn'}"><span class="day-shake-dot"></span>${t('browse.shake')} ×${shakeN} · 最高 ${gPeak.toFixed(2)}g</span>`
      : '';

    content.innerHTML = `
      <div class="day-head">
        <h2>${label}</h2>
        <span class="day-meta">${data.total>100 ? '本頁 ' : ''}${data.trips.length} ${t('index.stat.tripsUnit')} · ${fmtDuration(totalSec)}</span>
        ${emerTag}${shakeTag}
      </div>
      <div class="trips-grid">
        ${data.trips.length
          ? data.trips.map(renderTripCard).join('')
          : `<div class="empty"><div class="empty-icon">${camIcon()}</div><h3>${t('browse.noTripThisDay')}</h3></div>`}
      </div>`;
    if(data.total>100) {
      const pagination=document.createElement('div');pagination.className='editor-tools';
      for(const [label,next,disabled] of [['上一頁',Math.max(0,offset-100),offset===0],['下一頁',offset+100,offset+100>=data.total]]) {
        const button=document.createElement('button');button.className='btn';button.textContent=label;button.disabled=disabled;
        button.onclick=()=>selectDate(date,next);pagination.append(button);
      }
      const status=document.createElement('span');status.textContent=`${offset+1}–${offset+data.trips.length} / ${data.total}`;pagination.append(status);content.append(pagination);
    }
  } catch (e) {
    if (seq !== selectSeq) return;
    content.innerHTML = `<div class="empty"><div class="empty-icon">${camIcon()}</div>
      <h3>${t('common.loadFail')}</h3><p>${escapeHtml(e.message)}</p></div>`;
  }
}
</script>
</body>
</html>
