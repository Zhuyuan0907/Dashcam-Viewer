<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title data-i18n-title="title.change">設定新密碼 — 行車記錄</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    /* ── 強制改密碼頁 · 沿用登入頁的深色 auth 版面(scoped) ─────────────────────── */
    .auth-wrap {
      min-height: 100svh; margin: 0; padding: 0; color: #fff;
      display: grid; grid-template-columns: 1fr; gap: 0;
      background:
        radial-gradient(80% 120% at 12% 18%, color-mix(in oklch, var(--accent) 60%, transparent), transparent 55%),
        radial-gradient(70% 100% at 95% 95%, color-mix(in oklch, var(--accent) 32%, transparent), transparent 50%),
        linear-gradient(135deg, oklch(.30 .08 264), oklch(.14 .035 266));
      position: relative; overflow: hidden;
    }
    .auth-wrap::before {
      content: ""; position: absolute; inset: -20%;
      background:
        repeating-linear-gradient(115deg, transparent 0 84px, rgba(255,255,255,.035) 84px 85px),
        radial-gradient(rgba(255,255,255,.10) 1px, transparent 1.4px);
      background-size: auto, 24px 24px; pointer-events: none;
    }
    @media (min-width: 860px) { .auth-wrap { grid-template-columns: 1fr 1fr; } }
    .auth-col { position: relative; z-index: 1; display: flex; flex-direction: column;
      justify-content: center; padding: clamp(36px, 5vw, 80px); }
    .auth-form-side { align-items: center; }
    .auth-hero { gap: 22px; }
    .auth-hero .auth-brand-mark { background: transparent; color: #fff; width: 34px; height: 34px; }
    .auth-hero .auth-brand-mark svg { width: 26px; height: 26px; }
    .auth-brand { display: inline-flex; align-items: center; gap: 11px; margin-bottom: 6px; }
    .auth-hero-slogan { font-family: var(--font-display); font-weight: 900;
      font-size: clamp(44px, 5.5vw, 84px); line-height: 1.0; letter-spacing: -.045em; }
    .auth-hero-slogan em { font-style: normal; color: color-mix(in oklch, var(--accent) 45%, white);
      text-shadow: 0 0 32px color-mix(in oklch, var(--accent) 70%, transparent); }
    .auth-hero-sub { font-size: clamp(16px, 1.5vw, 20px); line-height: 1.6; color: rgba(255,255,255,.82); max-width: 26ch; }
    .auth-title { font-size: clamp(28px, 3.2vw, 38px); font-weight: 800; letter-spacing: -.02em; color: #fff; }
    .auth-sub { font-size: 15px; color: rgba(255,255,255,.7); margin: 8px 0 24px; }
    .auth-form-inner { width: 100%; max-width: 380px; }
    .auth-form-inner .form-label { color: rgba(255,255,255,.82); }
    .auth-form-inner .form-input { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.22); color: #fff; backdrop-filter: blur(6px); }
    .auth-form-inner .form-input::placeholder { color: rgba(255,255,255,.45); }
    .auth-form-inner .form-input:focus { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.18); background: rgba(255,255,255,.12); }
    .auth-form-inner .btn { background: #fff; color: var(--accent-2); box-shadow: 0 10px 26px -12px rgba(0,0,0,.55); text-decoration: none; }
    .auth-form-inner .btn:hover { background: #fff; color: var(--accent-2); filter: none; transform: translateY(-1.5px); box-shadow: 0 16px 34px -14px rgba(0,0,0,.6); text-decoration: none; }
    .auth-form-inner .form-error { background: color-mix(in oklch, var(--crit) 30%, transparent); color: #fff; }

    /* 安心話術:鎖頭圖示 + 淡色小字 */
    .auth-privacy { display: flex; align-items: flex-start; gap: 8px; margin-top: 16px;
      padding: 11px 13px; border-radius: var(--radius-sm);
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14);
      font-size: 12.5px; line-height: 1.6; color: rgba(255,255,255,.78); }
    .auth-privacy svg { flex: none; margin-top: 1px; opacity: .85; }

    @media (max-width: 859px) {
      .auth-wrap {
        display: flex; flex-direction: column;
        justify-content: center; align-items: center; gap: 4px;
        padding: calc(28px + var(--safe-top)) 22px calc(28px + var(--safe-bottom));
      }
      .auth-col { width: 100%; max-width: 400px; padding: 0; }
      .auth-hero { text-align: center; align-items: stretch; gap: 12px; margin-bottom: 22px; }
      .auth-brand { display: flex; width: 100%; justify-content: center; gap: 10px; margin-bottom: 2px; }
      .auth-hero-slogan { width: 100%; font-size: clamp(30px, 8.5vw, 44px); letter-spacing: -.03em; text-wrap: balance; }
      .auth-hero-sub { width: 100%; font-size: 14.5px; max-width: 30ch; margin: 0 auto; }
      .auth-form-side { align-items: stretch; padding-top: 0; }
      .auth-form-inner {
        width: 100%; max-width: 400px;
        background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16);
        border-radius: var(--radius-lg); padding: 26px 22px;
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 24px 60px -24px rgba(0,0,0,.55);
      }
      .auth-title { font-size: 25px; text-align: center; }
      .auth-sub { text-align: center; margin: 8px 0 22px; }
    }
    @media (max-width: 380px) {
      .auth-hero { margin-bottom: 16px; }
      .auth-hero-sub { display: none; }
    }
  </style>
<script src="/static/themes.js"></script><link rel="stylesheet" href="/static/themes.css"></head>
<body>

<div class="auth-wrap">
  <section class="auth-col auth-hero">
    <div class="auth-brand">
      <div class="auth-brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></div>
      <span class="auth-brand-name" style="color:#fff;font-weight:700;font-size:17px;">行車記錄</span>
    </div>
    <h2 class="auth-hero-slogan">安全上路<br><em>從一組新密碼開始</em></h2>
    <p class="auth-hero-sub" data-i18n="auth.change.sub">為了帳號安全，首次登入請設定一組新密碼。</p>
  </section>

  <section class="auth-col auth-form-side">
    <div class="auth-form-inner">
      <h1 class="auth-title" data-i18n="auth.change.title">設定新密碼</h1>
      <p class="auth-sub" data-i18n="auth.change.sub">為了帳號安全，首次登入請設定一組新密碼。</p>

      <form id="change-form" onsubmit="doChange(event)">
        <div class="form-field">
          <label class="form-label" for="pw-new" data-i18n="auth.change.new">新密碼</label>
          <input class="form-input" id="pw-new" type="password" autocomplete="new-password"
                 placeholder="至少 6 個字元" data-i18n-attr="placeholder:auth.change.newPlaceholder" required minlength="6">
        </div>
        <div class="form-field">
          <label class="form-label" for="pw-confirm" data-i18n="auth.change.confirm">確認新密碼</label>
          <input class="form-input" id="pw-confirm" type="password" autocomplete="new-password"
                 placeholder="再次輸入新密碼" data-i18n-attr="placeholder:auth.change.confirmPlaceholder" required>
        </div>
        <div class="form-error" id="change-error"></div>
        <div class="auth-privacy">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span data-i18n="auth.change.privacy">密碼只保存加鹽後的單向雜湊，系統無法還原明文。</span>
        </div>
        <button class="btn btn--solid btn--lg" type="submit" id="change-btn" style="width:100%;margin-top:16px;" data-i18n="auth.change.submit">設定並繼續</button>
      </form>
    </div>
  </section>
</div>

<div id="toast-container"></div>
<script src="/static/app.js"></script>
<script>
(async () => {
  await configReady;
  // checkAuth:未登入自動導 /login;本頁對「須改密碼」的使用者豁免導向(見 app.js)。
  const user = await checkAuth();
  if (user && !user.must_change_password) { location.href = '/'; return; }
})();

function doChange(e) { e.preventDefault(); performChange(); }
async function performChange() {
  const btn = document.getElementById('change-btn');
  const err = document.getElementById('change-error');
  err.classList.remove('show');
  const next = document.getElementById('pw-new').value;
  const confirm = document.getElementById('pw-confirm').value;
  if (next.length < 6) { err.textContent = t('auth.change.errShort'); err.classList.add('show'); return; }
  if (next !== confirm) { err.textContent = t('auth.change.errMismatch'); err.classList.add('show'); return; }

  btn.disabled = true;
  btn.textContent = t('auth.change.submitting');
  try {
    await apiFetch('/api/account/first-password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ next }),
    });
    location.href = '/';
  } catch (ex) {
    err.textContent = ex.message || t('auth.change.errFail');
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = t('auth.change.submit');
  }
}
</script>
</body>
</html>
